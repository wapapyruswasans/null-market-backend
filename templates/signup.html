<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>

<body>
    <form action="/signup" method="POST" id="signup-form">
        <h2>회원가입</h2>

        <div>
            <label for="username">아이디:</label>
            <input type="text" id="username" name="username" placeholder="아이디 입력" required>
        </div>

        <div>
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>

        <div>
            <label for="passwordConfirm">비밀번호 확인:</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호 다시 입력" required>
        </div>

        <div>
            <label for="name">이름:</label>
            <input type="text" id="name" name="name" placeholder="이름 입력" required>
        </div>

        <div>
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <button type="submit" id="signup-button">가입하기</button>
    </form>

    <script>
        const form = document.getElementById('signup-form');

        form.addEventListener('submit', function (event) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (username.length < 4) {
                alert('아이디는 4자 이상 입력해주세요.');
                event.preventDefault();
                return;
            }

            if (password.length < 8) {
                alert('비밀번호는 8자 이상 입력해주세요.');
                event.preventDefault();
                return;
            }

            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                event.preventDefault();
                return;
            }
        });
    </script>
</body>

</html>
